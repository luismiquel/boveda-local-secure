<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bóveda Personal</title>
    <meta name="description" content="Tu asistente de privacidad 100% local">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Bóveda">
    <link rel="apple-touch-icon" href="https://picsum.photos/seed/boveda/192/192">
    <style>
        body { 
            background-color: #0a0a0a; 
            color: #e5e5e5; 
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }
        #root { min-height: 100vh; display: flex; flex-direction: column; }
        
        /* Splash screen simple mientras carga React */
        #loading-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(59, 130, 246, 0.1);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="antialiased">
    <div id="loading-screen">
        <div class="spinner"></div>
        <p style="margin-top: 20px; font-size: 10px; font-weight: bold; letter-spacing: 2px; color: #4b5563; text-transform: uppercase;">Iniciando Bóveda...</p>
    </div>

    <div id="root"></div>

    <!-- Script principal con cache busting -->
    <script type="module" src="/src/index.tsx?v=300"></script>

    <script>
        // Eliminar splash screen cuando React tome el control
        window.addEventListener('load', () => {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/sw.js').then(reg => {
                    console.log('Bóveda SW registrada con éxito');
                }).catch(err => {
                    console.error('Error al registrar SW:', err);
                });
            }
        });
        
        // Función de emergencia por si el usuario sigue viendo problemas
        window.forceResetApp = function() {
            localStorage.clear();
            sessionStorage.clear();
            if ('caches' in window) {
                caches.keys().then(names => {
                    for (let name of names) caches.delete(name);
                });
            }
            location.reload(true);
        };
    </script>
</body>
</html>
